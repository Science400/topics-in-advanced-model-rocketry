# Section map — ch2, scaffolded from ch2-aerodynamic-stability.typ
#
# `start` is a HINT that narrows the search for a heading in the OCR'd
# text; emit.py cuts sections at the heading itself, so an approximate
# number is fine and 0 means "search the whole chapter". Fill them in
# to make heading matching more robust on a long chapter.
#
# The order below is the document order and is authoritative while any
# start is still 0. Do not reorder.
#
# Boundaries verified against the scan so far (PDF page, printed page):
#   0    Introduction          p11  (-63-)
#   1    The Dynamical Equations  p15  (-67-)   1 and 1.1 share a page
#   1.1  Euler's Angles           p15  (-67-)
#   1.2  Angular Velocity         p17  (-69-)
# Left as 0 deliberately: a partly-filled map gives a section a start with no
# next start to bound it, so its page range runs to the end of the chapter and
# `ocr.py --section` would transcribe 190 pages. Fill them all or none; until
# then use `--pages`.

chapter = 2
pdf = "ch2-aerodynamic-stability.pdf"
pages = 208

[frontmatter]
# Pages 1-10 are the title page and the six-page symbol table, which is
# hand-typed into the chapter as #table() and read back by symtab.py rather
# than OCR'd. Body text runs 11-206; references begin on 207.
body_starts = 11
references = 207
# Unlike ch1, this chapter's PDF page does not equal its printed page:
# PDF 11 is stamped "-63-". Reports cite both.
page_offset = 52

