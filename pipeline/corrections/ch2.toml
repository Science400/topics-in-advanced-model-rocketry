# Correction rules for Chapter 2, applied by emit.py on every run.
#
# When you find yourself making the same edit twice, put it here instead.
# Re-emitting overwrites the chapter body, so a fix that lives only in the .typ
# is lost the next time the chapter is regenerated.
#
#   [[math]]   applied to converted Typst math only — never touches prose
#   [[prose]]  applied to prose text only — never touches math
#   [[any]]    applied to the finished section, math and prose alike
#
# Literal find/replace by default. Set regex = true for a pattern.
# `note` is for you; it is printed by `python pipeline/corrections.py ch2`.

# Nothing yet. The symbol table already canonicalises spellings automatically
# (C_{2R}, C_{2 R} and C_(2R) all collapse to the table's spelling), so a rule
# belongs here only for something the table cannot express.

# The typewriter's capital C has an almost closed aperture, so olmocr reads
# "C.G." as "O.G." — inconsistently, since it gets "C.P." right on the same
# line. Verified against the scan at high resolution on page 11 (printed -63-):
# the book says "center of gravity (C.G.)".
[[prose]]
find = "O.G."
replace = "C.G."
note = "closed-aperture C misread as O; the book means center of gravity"

[[any]]
find = "  +"
replace = " "
regex = true
note = "collapse runs of spaces"
